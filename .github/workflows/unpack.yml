name: Build ShowFlow Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and extract ShowFlow source ZIP
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Prefer the latest named ShowFlow source archive. Avoid scanning
          # extracted build folders if the workflow is customized later.
          $zips = @(Get-ChildItem -Path $PWD -Filter '*.zip' -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/](target|node_modules|_showflow_extract)[\\/]' } |
            Sort-Object @{
              Expression = {
                if ($_.Name -like 'ShowFlow_GitHub_Actions_Ready*') { 0 }
                elseif ($_.Name -like 'ShowFlow_Single_Display_Background_Mode*') { 1 }
                elseif ($_.Name -like 'ShowFlow*') { 2 }
                else { 3 }
              }
            }, LastWriteTime -Descending)

          if ($zips.Count -eq 0) {
            throw 'No ShowFlow source ZIP found. Upload ShowFlow_GitHub_Actions_Ready.zip to the repository root.'
          }

          $projectDir = $null
          $index = 0
          foreach ($zip in $zips) {
            $index++
            $destination = Join-Path $PWD "_showflow_extract_$index"
            Write-Host "Checking archive: $($zip.Name)"
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $destination -Force

            $cargoFiles = @(Get-ChildItem -Path $destination -Filter 'Cargo.toml' -File -Recurse)
            foreach ($cargoFile in $cargoFiles) {
              $candidate = $cargoFile.Directory.FullName
              if ((Test-Path (Join-Path $candidate 'src-tauri')) -and
                  (Test-Path (Join-Path $candidate 'package.json')) -and
                  (Test-Path (Join-Path $candidate 'vite.config.js'))) {
                $projectDir = $candidate
                break
              }
            }
            if ($projectDir) { break }
          }

          if (-not $projectDir) {
            throw 'Could not find the ShowFlow project (Cargo.toml, src-tauri/, package.json and vite.config.js) in any ZIP.'
          }

          $projectDir = (Resolve-Path $projectDir).Path
          Write-Host "ShowFlow project: $projectDir"
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "project_dir=$projectDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.PROJECT_DIR }} -> target

      - name: Verify toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
