                if ($_.Name -like 'ShowFlow_GitHub_Actions_Ready*') { 0 }
                elseif ($_.Name -like 'ShowFlow_Single_Display_Background_Mode*') { 1 }
                elseif ($_.Name -like 'ShowFlow*') { 2 }
                else { 3 }
              }
            }, LastWriteTime -Descending)

          if ($zips.Count -eq 0) {
            throw 'No ShowFlow source ZIP found in the repository.'
          }

          $projectDir = $null
          $index = 0

          foreach ($zip in $zips) {
            $index++
            $destination = Join-Path $PWD "_showflow_extract_$index"
            Write-Host "Checking archive: $($zip.Name)"
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $destination -Force

            $cargoFiles = @(Get-ChildItem -Path $destination -Filter 'Cargo.toml' -File -Recurse)
            foreach ($cargoFile in $cargoFiles) {
              $candidate = $cargoFile.Directory.FullName
              if ((Test-Path (Join-Path $candidate 'src-tauri')) -and
                  (Test-Path (Join-Path $candidate 'package.json')) -and
                  (Test-Path (Join-Path $candidate 'vite.config.js'))) {
                $projectDir = $candidate
                break
              }
            }

            if ($projectDir) { break }
          }

          if (-not $projectDir) {
            throw 'ShowFlow project not found in ZIP. Expected Cargo.toml, src-tauri/, package.json and vite.config.js.'
          }

          $projectDir = (Resolve-Path $projectDir).Path
          Write-Host "ShowFlow project directory: $projectDir"
          "project_dir=$projectDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ steps.source.outputs.project_dir }} -> target

      - name: Verify toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Run Rust tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: pwsh
        run: cargo test --workspace

      - name: Install frontend and Tauri dependencies
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build ShowFlow installer
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: pwsh
        run: npm run build

      - name: Verify installer exists
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: pwsh
        run: |
          $installerDir = Join-Path $PWD 'target/release/bundle/nsis'
          $installers = @(Get-ChildItem -Path $installerDir -Filter '*.exe' -File -ErrorAction SilentlyContinue)

          if ($installers.Count -eq 0) {
            throw "No NSIS installer EXE found in $installerDir"
          }

          $installers | ForEach-Object {
            Write-Host ("Found installer: {0} ({1:N2} MB)" -f $_.FullName, ($_.Length / 1MB))
          }

      - name: Upload ShowFlow installer
        uses: actions/upload-artifact@v4
        with:
          name: ShowFlow-Windows-Installer
          path: ${{ steps.source.outputs.project_dir }}/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
