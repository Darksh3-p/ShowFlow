name: Build ShowFlow from zip

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and unzip the ShowFlow source zip
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem -Path . -Filter *.zip -File -Recurse)
          if ($zips.Count -eq 0) { throw "No .zip file found in the repository." }
          # Prefer ShowFlow_Source*.zip, then try every other zip
          $ordered = @($zips | Where-Object { $_.Name -like 'ShowFlow_Source*' }) + @($zips | Where-Object { $_.Name -notlike 'ShowFlow_Source*' })
          $dir = $null
          $i = 0
          foreach ($z in $ordered) {
            $i++
            $dest = "$PWD/_extracted_$i"
            Write-Host "Trying $($z.Name)"
            Expand-Archive -Path $z.FullName -DestinationPath $dest -Force
            $cargo = Get-ChildItem -Path $dest -Filter Cargo.toml -Recurse |
                     Where-Object { Test-Path (Join-Path $_.DirectoryName 'src-tauri') } |
                     Select-Object -First 1
            if ($cargo) { $dir = $cargo.DirectoryName.Replace('\','/'); Write-Host "Found project in $($z.Name)"; break }
            Write-Host "  not the ShowFlow source, skipping"
          }
          if (-not $dir) { throw "None of the zip files contain the ShowFlow project. Upload ShowFlow_Source.zip to the repo." }
          Write-Host "Project directory: $dir"
          "PROJECT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $dir

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test -p showflow-core -p showflow-sharing

      - name: Install Tauri CLI
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build installer
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ShowFlow-installer
          path: ${{ env.PROJECT_DIR }}/target/release/bundle/nsis/*.exe
          if-no-files-found: error
