name: Build ShowFlow from zip

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the source zip found in the repo
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter *.zip -File -Recurse | Select-Object -First 1
          if (-not $zip) { throw "No .zip file found in the repository. Upload ShowFlow_Source.zip to the repo root." }
          Write-Host "Extracting $($zip.FullName)"
          Expand-Archive -Path $zip.FullName -DestinationPath "$PWD/_extracted" -Force
          $cargo = Get-ChildItem -Path "$PWD/_extracted" -Filter Cargo.toml -Recurse |
                   Where-Object { Test-Path (Join-Path $_.DirectoryName 'src-tauri') } |
                   Select-Object -First 1
          if (-not $cargo) { throw "Could not find the project (Cargo.toml next to src-tauri) inside the zip." }
          $dir = $cargo.DirectoryName.Replace('\','/')
          Write-Host "Project directory: $dir"
          "PROJECT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $dir

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test -p showflow-core -p showflow-sharing

      - name: Install Tauri CLI
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build installer
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ShowFlow-installer
          path: ${{ env.PROJECT_DIR }}/target/release/bundle/nsis/*.exe
          if-no-files-found: error
