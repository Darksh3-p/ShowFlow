name: Unpack project

# Put THIS file at .github/workflows/unpack.yml by hand (GitHub: Add file > Create new file).
# Then upload kestrel_project.zip to the repository root and run this workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into the repository
        run: |
          set -e
          ZIP="kestrel_project.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::kestrel_project.zip was not found in the repository root. Upload it first (Add file > Upload files), then run this again."
            exit 1
          fi
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          rm -rf "$TMP/__MACOSX"
          COUNT="$(find "$TMP" -mindepth 1 -maxdepth 1 | wc -l)"
          SRC="$TMP"
          if [ "$COUNT" -eq 1 ] && [ -d "$(find "$TMP" -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find "$TMP" -mindepth 1 -maxdepth 1)"
          fi
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. .
          rm -f "$ZIP"
          ls

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit."; else
            git commit -m "chore: unpack project"
            git push
          fi
